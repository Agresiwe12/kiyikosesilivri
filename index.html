<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KıyıKöşe Silivri - Mahalle, Pazar & Esnaf Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

  <!-- Üst Bar (Header) -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-emerald-500 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-water text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">KıyıKöşe <span class="text-sky-600">Silivri</span></h1>
          <p class="text-[10px] text-slate-500 font-medium">Silivri'ninher kıyısı, her köşesi burada </p>
        </div>
      </div>
      <button onclick="openModal()" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1 shadow-sm transition">
        <i class="fa-solid fa-plus text-xs"></i> <span id="addBtnText">Paylaş</span>
      </button>
    </div>
  </header>

  <!-- Hızlı Bilgi Bandı (Nöbetçi Eczane & Hava Durumu) -->
  <div class="bg-sky-50 border-b border-sky-100 px-4 py-2">
    <div class="max-w-md mx-auto flex items-center justify-between text-xs text-sky-900">
      <div class="flex items-center gap-1.5 font-medium">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <i class="fa-solid fa-kit-medical text-red-500"></i> Nöbetçi: Merkez Eczanesi (Sahil)
      </div>
      <span class="text-[11px] text-sky-700 bg-sky-200/60 px-2 py-0.5 rounded-full font-semibold">Silivri 20°C</span>
    </div>
  </div>

  <!-- Ana İçerik Konteyneri -->
  <main class="max-w-md mx-auto px-4 pt-3">
    
    <!-- Mahalle Filtreleri -->
    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none text-xs font-medium">
      <button onclick="filterContent('Tümü')" class="filter-btn active bg-slate-900 text-white px-3 py-1.5 rounded-full whitespace-nowrap">Tüm Silivri</button>
      <button onclick="filterContent('Selimpaşa')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Selimpaşa</button>
      <button onclick="filterContent('Merkez')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Sahil / Merkez</button>
      <button onclick="filterContent('Değirmenköy')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Değirmenköy</button>
      <button onclick="filterContent('Gümüşyaka')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Gümüşyaka</button>
      <button onclick="filterContent('Çanta')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Çanta</button>
    </div>

    <!-- 1. SEKME: MEYDAN -->
    <section id="tab-meydan" class="tab-content mt-3 space-y-3">
      <div id="posts-container" class="space-y-3">
        <div class="p-8 text-center text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-sky-600"></i><p>Yükleniyor...</p></div>
      </div>
    </section>

    <!-- 2. SEKME: PAZAR -->
    <section id="tab-pazar" class="tab-content mt-3 hidden">
      <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl mb-3 flex items-center justify-between text-xs text-emerald-800">
        <span><i class="fa-solid fa-basket-shopping text-emerald-600 mr-1"></i> Aracısız yerel pazar</span>
        <button onclick="openModal('pazar')" class="font-bold underline text-emerald-900">İlan Ekle</button>
      </div>
      <div id="market-container" class="grid grid-cols-2 gap-3">
        <div class="p-8 text-center text-slate-400 text-sm col-span-2"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-emerald-600"></i><p>İlanlar yükleniyor...</p></div>
      </div>
    </section>

    <!-- 3. SEKME: ESNAF -->
    <section id="tab-esnaf" class="tab-content mt-3 hidden space-y-3">
      <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl mb-3 flex items-center justify-between text-xs text-amber-800">
        <span><i class="fa-solid fa-medal text-amber-600 mr-1"></i> Komşu ustalar & esnaflar</span>
        <button onclick="openModal('esnaf')" class="font-bold underline text-amber-900">Kendini Ekle</button>
      </div>
      <div id="business-container" class="space-y-2.5">
        <div class="p-8 text-center text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-amber-600"></i><p>Esnaf rehberi yükleniyor...</p></div>
      </div>
    </section>

  </main>

  <!-- Çok Amaçlı Ekleme Modalı -->
  <div id="createModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl animate-fade-in max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modalTitle" class="font-bold text-slate-900 text-base">Paylaşım Yap</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>
      
      <!-- Sekme Seçici -->
      <div class="flex gap-2 border-b border-slate-100 pb-3 mb-3 text-xs">
        <button type="button" onclick="switchModalForm('meydan')" id="modalBtnMeydan" class="flex-1 py-1.5 rounded-lg bg-sky-50 text-sky-700 font-bold">Meydan Notu</button>
        <button type="button" onclick="switchModalForm('pazar')" id="modalBtnPazar" class="flex-1 py-1.5 rounded-lg bg-slate-50 text-slate-600 font-medium">Pazar İlanı</button>
        <button type="button" onclick="switchModalForm('esnaf')" id="modalBtnEsnaf" class="flex-1 py-1.5 rounded-lg bg-slate-50 text-slate-600 font-medium">Esnaf Kaydı</button>
      </div>

      <!-- Form 1: Meydan Notu -->
      <form id="form-meydan" onsubmit="event.preventDefault(); submitPost();" class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Adınız / Rumuz</label>
          <input id="postAuthor" type="text" required placeholder="Örn: Selimpaşalı Ali" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Mahalle</label>
          <select id="postNeighborhood" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-sky-500 bg-white">
            <option value="Merkez">Silivri Merkez</option>
            <option value="Selimpaşa">Selimpaşa</option>
            <option value="Gümüşyaka">Gümüşyaka</option>
            <option value="Değirmenköy">Değirmenköy</option>
            <option value="Çanta">Çanta</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Mesajınız</label>
          <textarea id="postContent" required rows="3" placeholder="Sohbet, soru, yol durumu veya mahalle duyurusu..." class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-sky-500"></textarea>
        </div>
        <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-lg transition">Meydanda Yayınla</button>
      </form>

      <!-- Form 2: Pazar İlanı -->
      <form id="form-pazar" onsubmit="event.preventDefault(); submitMarketItem();" class="space-y-3 text-xs hidden">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Ürün Başlığı</label>
          <input id="itemTitle" type="text" required placeholder="Örn: Doğal Bahçe Zeytini (5 Kg)" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Fiyat (₺)</label>
            <input id="itemPrice" type="number" required placeholder="450" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Kategori</label>
            <select id="itemCategory" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-emerald-500 bg-white">
              <option value="Köyden & Bahçeden">Köyden & Bahçeden</option>
              <option value="Yazlık & İkinci El">Yazlık & İkinci El</option>
              <option value="El Emeği">El Emeği</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Mahalle (Teslimat)</label>
          <select id="itemNeighborhood" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-emerald-500 bg-white">
            <option value="Merkez">Silivri Merkez</option>
            <option value="Selimpaşa">Selimpaşa</option>
            <option value="Gümüşyaka">Gümüşyaka</option>
            <option value="Değirmenköy">Değirmenköy</option>
            <option value="Çanta">Çanta</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Açıklama / İletişim</label>
          <textarea id="itemDesc" rows="2" placeholder="Ürün durumu veya teslimat saati..." class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-emerald-500"></textarea>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">Pazarda Yayınla</button>
      </form>

      <!-- Form 3: Esnaf Kaydı -->
      <form id="form-esnaf" onsubmit="event.preventDefault(); submitBusiness();" class="space-y-3 text-xs hidden">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">İşletme / Usta Adı</label>
          <input id="bizName" type="text" required placeholder="Örn: Usta Elektrik & Aydınlatma" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-amber-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Hizmet Alanı</label>
            <select id="bizCategory" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-amber-500 bg-white">
              <option value="Tesisat & Su">Tesisat & Su</option>
              <option value="Elektrik">Elektrik</option>
              <option value="Bahçe & Budama">Bahçe & Budama</option>
              <option value="Veteriner">Veteriner</option>
              <option value="Tamir & Bakım">Tamir & Bakım</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Telefon</label>
            <input id="bizPhone" type="tel" required placeholder="0532XXXXXXX" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-amber-500">
          </div>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Bölge</label>
          <select id="bizNeighborhood" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-amber-500 bg-white">
            <option value="Tüm Silivri">Tüm Silivri</option>
            <option value="Merkez">Silivri Merkez</option>
            <option value="Selimpaşa">Selimpaşa</option>
            <option value="Gümüşyaka">Gümüşyaka</option>
            <option value="Değirmenköy">Değirmenköy</option>
            <option value="Çanta">Çanta</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg transition">Esnaf Listesine Kaydet</button>
      </form>

    </div>
  </div>

  <!-- Alt Menü (Bottom Navigation) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40 py-2">
    <div class="max-w-md mx-auto flex justify-around text-center">
      <button onclick="switchTab('meydan')" id="tabBtnMeydan" class="text-sky-600 flex flex-col items-center">
        <i class="fa-solid fa-compass text-base"></i>
        <span class="text-[10px] font-bold mt-0.5">Meydan</span>
      </button>
      <button onclick="switchTab('pazar')" id="tabBtnPazar" class="text-slate-400 hover:text-slate-600 flex flex-col items-center">
        <i class="fa-solid fa-basket-shopping text-base"></i>
        <span class="text-[10px] font-medium mt-0.5">Pazar</span>
      </button>
      <button onclick="switchTab('esnaf')" id="tabBtnEsnaf" class="text-slate-400 hover:text-slate-600 flex flex-col items-center">
        <i class="fa-solid fa-wrench text-base"></i>
        <span class="text-[10px] font-medium mt-0.5">Esnaf</span>
      </button>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://vsdrfmdpripcshcgqvxm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AqSPfSbaoFRQnCNiQGr3Dg_Lf5ztqvk';
    const db = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let activeTab = 'meydan';
    let currentFilter = 'Tümü';
    let postsData = [], marketData = [], businessData = [];

    async function loadAllData() {
      await Promise.all([fetchPosts(), fetchMarket(), fetchBusinesses()]);
    }

    async function fetchPosts() {
      try {
        const { data, error } = await db.from('posts').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        postsData = data || [];
        renderPosts();
      } catch (e) { console.error(e); }
    }

    async function fetchMarket() {
      try {
        const { data, error } = await db.from('market_items').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        marketData = data || [];
        renderMarket();
      } catch (e) { console.error(e); }
    }

    async function fetchBusinesses() {
      try {
        const { data, error } = await db.from('businesses').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        businessData = data || [];
        renderBusinesses();
      } catch (e) { console.error(e); }
    }

    function renderPosts() {
      const container = document.getElementById('posts-container');
      const filtered = currentFilter === 'Tümü' ? postsData : postsData.filter(p => (p.neighborhood||'').includes(currentFilter));
      if (!filtered.length) {
        container.innerHTML = '<div class="bg-white rounded-xl p-5 border text-center text-xs text-slate-500">Bu mahallede henüz paylaşım yok. İlk notu siz bırakın!</div>';
        return;
      }
      container.innerHTML = filtered.map(p => `
        <div class="bg-white rounded-xl p-4 border border-slate-200/80 shadow-[0_1px_3px_rgba(0,0,0,0.04)]">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center font-bold text-xs">${(p.category||'S')[0].toUpperCase()}</div>
              <div><h4 class="text-xs font-bold text-slate-800 leading-tight">${p.category||'Silivri Sakini'}</h4><span class="text-[10px] text-slate-400">${p.neighborhood}</span></div>
            </div>
            <span class="text-[10px] bg-sky-50 text-sky-700 px-2 py-0.5 rounded-full font-semibold">${p.neighborhood}</span>
          </div>
          <p class="text-xs text-slate-700 leading-relaxed">${p.content}</p>
        </div>
      `).join('');
    }

    function renderMarket() {
      const container = document.getElementById('market-container');
      const filtered = currentFilter === 'Tümü' ? marketData : marketData.filter(m => (m.neighborhood||'').includes(currentFilter));
      if (!filtered.length) {
        container.innerHTML = '<div class="bg-white rounded-xl p-5 border text-center text-xs text-slate-500 col-span-2">Bu mahallede henüz ilan yok.</div>';
        return;
      }
      container.innerHTML = filtered.map(m => `
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between p-3">
          <div>
            <div class="flex justify-between items-start mb-1">
              <span class="text-[10px] bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded font-medium">${m.category}</span>
              <span class="text-[10px] text-slate-400">${m.neighborhood}</span>
            </div>
            <h4 class="text-xs font-bold text-slate-900 mt-1 line-clamp-2">${m.title}</h4>
            <p class="text-[11px] text-slate-500 mt-1 line-clamp-2">${m.description||''}</p>
          </div>
          <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
            <span class="text-xs font-bold text-emerald-700">${m.price} ₺</span>
            <span class="text-[9px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-semibold">Elden Teslim</span>
          </div>
        </div>
      `).join('');
    }

    function renderBusinesses() {
      const container = document.getElementById('business-container');
      const filtered = currentFilter === 'Tümü' ? businessData : businessData.filter(b => (b.neighborhood||'').includes(currentFilter) || b.neighborhood === 'Tüm Silivri');
      if (!filtered.length) {
        container.innerHTML = '<div class="bg-white rounded-xl p-5 border text-center text-xs text-slate-500">Bu bölgede kayıtlı esnaf bulunamadı.</div>';
        return;
      }
      container.innerHTML = filtered.map(b => `
        <div class="bg-white rounded-xl p-3.5 border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <div class="flex items-center gap-1.5">
              <h4 class="text-xs font-bold text-slate-900">${b.name}</h4>
              ${b.verified ? '<i class="fa-solid fa-circle-check text-sky-500 text-[11px]" title="Onaylı Esnaf"></i>' : ''}
            </div>
            <div class="flex items-center gap-2 mt-0.5 text-[10px] text-slate-500">
              <span class="font-medium text-amber-600"><i class="fa-solid fa-star text-[9px]"></i> ${b.rating || 5.0} (${b.review_count || 1})</span>
              <span>•</span>
              <span>${b.category}</span>
              <span>•</span>
              <span>${b.neighborhood}</span>
            </div>
          </div>
          <a href="tel:${b.phone}" class="bg-emerald-600 hover:bg-emerald-700 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs shadow-sm transition">
            <i class="fa-solid fa-phone"></i>
          </a>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');

      ['meydan', 'pazar', 'esnaf'].forEach(t => {
        const btn = document.getElementById('tabBtn' + t.charAt(0).toUpperCase() + t.slice(1));
        if (t === tab) {
          btn.className = 'text-sky-600 flex flex-col items-center';
          btn.querySelector('span').className = 'text-[10px] font-bold mt-0.5';
        } else {
          btn.className = 'text-slate-400 hover:text-slate-600 flex flex-col items-center';
          btn.querySelector('span').className = 'text-[10px] font-medium mt-0.5';
        }
      });

      const btnText = document.getElementById('addBtnText');
      if (tab === 'meydan') btnText.innerText = 'Paylaş';
      else if (tab === 'pazar') btnText.innerText = 'İlan Ver';
      else btnText.innerText = 'Esnaf Ekle';
    }

    function filterContent(nh) {
      currentFilter = nh;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('bg-slate-900', btn.innerText.includes(nh));
        btn.classList.toggle('text-white', btn.innerText.includes(nh));
        btn.classList.toggle('bg-white', !btn.innerText.includes(nh));
        btn.classList.toggle('text-slate-700', !btn.innerText.includes(nh));
      });
      renderPosts();
      renderMarket();
      renderBusinesses();
    }

    function openModal(defaultForm = activeTab) {
      document.getElementById('createModal').classList.remove('hidden');
      switchModalForm(defaultForm);
    }
    function closeModal() { document.getElementById('createModal').classList.add('hidden'); }

    function switchModalForm(formName) {
      ['meydan', 'pazar', 'esnaf'].forEach(f => {
        document.getElementById('form-' + f).classList.toggle('hidden', f !== formName);
        const btn = document.getElementById('modalBtn' + f.charAt(0).toUpperCase() + f.slice(1));
        btn.className = f === formName ? 'flex-1 py-1.5 rounded-lg bg-sky-50 text-sky-700 font-bold' : 'flex-1 py-1.5 rounded-lg bg-slate-50 text-slate-600 font-medium';
      });
      document.getElementById('modalTitle').innerText = formName === 'meydan' ? 'Mahalle Notu Bırak' : formName === 'pazar' ? 'Yeni Pazar İlanı' : 'Esnaf / Usta Ekle';
    }

    async function submitPost() {
      const name = document.getElementById('postAuthor').value;
      const nh = document.getElementById('postNeighborhood').value;
      const content = document.getElementById('postContent').value;
      const { error } = await db.from('posts').insert([{ category: name, neighborhood: nh, content }]);
      if (error) return alert(error.message);
      closeModal();
      document.getElementById('postContent').value = '';
      fetchPosts();
    }

    async function submitMarketItem() {
      const title = document.getElementById('itemTitle').value;
      const price = document.getElementById('itemPrice').value;
      const cat = document.getElementById('itemCategory').value;
      const nh = document.getElementById('itemNeighborhood').value;
      const desc = document.getElementById('itemDesc').value;
      const { error } = await db.from('market_items').insert([{ title, price: Number(price), category: cat, neighborhood: nh, description: desc }]);
      if (error) return alert(error.message);
      closeModal();
      document.getElementById('itemTitle').value = '';
      document.getElementById('itemPrice').value = '';
      fetchMarket();
      switchTab('pazar');
    }

    async function submitBusiness() {
      const name = document.getElementById('bizName').value;
      const cat = document.getElementById('bizCategory').value;
      const phone = document.getElementById('bizPhone').value;
      const nh = document.getElementById('bizNeighborhood').value;
      const { error } = await db.from('businesses').insert([{ name, category: cat, phone, neighborhood: nh, rating: 5.0, review_count: 1, verified: true }]);
      if (error) return alert(error.message);
      closeModal();
      document.getElementById('bizName').value = '';
      document.getElementById('bizPhone').value = '';
      fetchBusinesses();
      switchTab('esnaf');
    }

    window.onload = loadAllData;
  </script>
</body>
