<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KıyıKöşe Silivri - Mahalle, Pazar & Esnaf Platformu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

  <!-- Üst Bar (Header - Estetik Başlık & Canlılık Rozeti) -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 px-3.5 py-2.5 shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      <!-- Sol Taraf: Logo ve Estetik Başlık -->
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="relative flex-shrink-0">
          <img src="logo.png.jfıf" alt="KıyıKöşe Silivri" class="w-10 h-10 rounded-xl object-contain bg-white shadow-sm border border-slate-100 p-0.5">
          <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
        <div class="min-w-0 flex flex-col justify-center">
          <div class="flex items-baseline gap-1 leading-none">
            <span class="text-[15px] font-extrabold tracking-tight text-slate-900">Kıyı<span class="text-emerald-600">Köşe</span></span>
            <span class="text-[11px] font-bold text-sky-600 uppercase tracking-wider bg-sky-50 px-1.5 py-0.5 rounded-md border border-sky-100">Silivri</span>
          </div>
          <p class="text-[10px] text-slate-400 font-medium tracking-tight mt-0.5 truncate">Yerel Meydan & Pazar</p>
        </div>
      </div>
      
      <!-- Sağ Taraf: Profil ve Paylaş Butonu -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <div id="userStatusArea">
          <button onclick="openAuthModal('login')" class="text-xs font-semibold text-sky-700 bg-sky-50 hover:bg-sky-100 border border-sky-200 px-2.5 py-1.5 rounded-full transition">
            Giriş Yap
          </button>
        </div>
        <button onclick="openModal()" class="bg-gradient-to-r from-sky-600 to-sky-700 hover:from-sky-700 hover:to-sky-800 text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm transition active:scale-95">
          <i class="fa-solid fa-plus text-[10px]"></i> <span id="addBtnText">Paylaş</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hızlı Bilgi Bandı -->
  <div class="bg-sky-50 border-b border-sky-100 px-4 py-2">
    <div class="max-w-md mx-auto flex items-center justify-between text-xs text-sky-900">
      <div class="flex items-center gap-1.5 font-medium">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <i class="fa-solid fa-kit-medical text-red-500"></i> Nöbetçi: Merkez Eczanesi (Sahil)
      </div>
      <span class="text-[11px] text-sky-700 bg-sky-200/60 px-2 py-0.5 rounded-full font-semibold">Silivri 20°C</span>
    </div>
  </div>

  <!-- Ana İçerik Konteyneri -->
  <main class="max-w-md mx-auto px-4 pt-3">
    
    <!-- Mahalle & Bölge Filtreleri -->
    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none text-xs font-medium">
      <button onclick="filterContent('Tümü')" class="filter-btn active bg-slate-900 text-white px-3 py-1.5 rounded-full whitespace-nowrap">Tüm Silivri</button>
      <button onclick="filterContent('Merkez')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Merkez / Sahil</button>
      <button onclick="filterContent('Selimpaşa')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Selimpaşa</button>
      <button onclick="filterContent('Gümüşyaka')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Gümüşyaka</button>
      <button onclick="filterContent('Değirmenköy')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Değirmenköy</button>
      <button onclick="filterContent('Çanta')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Çanta</button>
      <button onclick="filterContent('Kavakköy')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Kavaklı / Ortaköy</button>
      <button onclick="filterContent('Kırsal')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">🌲 Kırsal & Köyler (Köşe)</button>
    </div>

    <!-- 1. SEKME: MEYDAN -->
    <section id="tab-meydan" class="tab-content mt-3 space-y-3">
      <div id="posts-container" class="space-y-3">
        <div class="p-8 text-center text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-sky-600"></i><p>Yükleniyor...</p></div>
      </div>
    </section>

    <!-- 2. SEKME: PAZAR -->
    <section id="tab-pazar" class="tab-content mt-3 hidden">
      <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl mb-3 flex items-center justify-between text-xs text-emerald-800">
        <span><i class="fa-solid fa-basket-shopping text-emerald-600 mr-1"></i> Aracısız yerel pazar</span>
        <button onclick="openModal('pazar')" class="font-bold underline text-emerald-900">İlan Ekle</button>
      </div>
      <div id="market-container" class="grid grid-cols-2 gap-3">
        <div class="p-8 text-center text-slate-400 text-sm col-span-2"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-emerald-600"></i><p>İlanlar yükleniyor...</p></div>
      </div>
    </section>

    <!-- 3. SEKME: ESNAF -->
    <section id="tab-esnaf" class="tab-content mt-3 hidden space-y-3">
      <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl mb-3 flex items-center justify-between text-xs text-amber-800">
        <span><i class="fa-solid fa-medal text-amber-600 mr-1"></i> Komşu ustalar & esnaflar</span>
        <button onclick="openModal('esnaf')" class="font-bold underline text-amber-900">Kendini Ekle</button>
      </div>
      <div id="business-container" class="space-y-2.5">
        <div class="p-8 text-center text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-amber-600"></i><p>Esnaf rehberi yükleniyor...</p></div>
      </div>
    </section>

  </main>

  <!-- ÜYELİK & GİRİŞ MODALI (T.C. KİMLİK KONTROLLÜ) -->
  <div id="authModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl animate-fade-in max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 id="authModalTitle" class="font-bold text-slate-900 text-base">Silivri Sakini Girişi</h3>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>

      <!-- Giriş / Kayıt Geçiş Sekmesi -->
      <div class="flex gap-2 border-b border-slate-100 pb-3 mb-3 text-xs">
        <button type="button" onclick="switchAuthTab('login')" id="authTabBtnLogin" class="flex-1 py-1.5 rounded-lg bg-sky-50 text-sky-700 font-bold">Giriş Yap</button>
        <button type="button" onclick="switchAuthTab('register')" id="authTabBtnRegister" class="flex-1 py-1.5 rounded-lg bg-slate-50 text-slate-600 font-medium">T.C. ile Kayıt Ol</button>
      </div>

      <!-- GİRİŞ FORMU -->
      <form id="form-login" onsubmit="event.preventDefault(); handleLogin();" class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">E-posta Adresi</label>
          <input id="loginEmail" type
