<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KıyıKöşe Silivri - Mahalle & Esnaf Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

  <!-- Üst Bar (Header) -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-emerald-500 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-water text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">KıyıKöşe <span class="text-sky-600">Silivri</span></h1>
          <p class="text-[10px] text-slate-500 font-medium">Mahallenin Dijital Meydanı</p>
        </div>
      </div>
      <button onclick="openPostModal()" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1 shadow-sm transition">
        <i class="fa-solid fa-plus text-xs"></i> Paylaş
      </button>
    </div>
  </header>

  <!-- Hızlı Bilgi Bandı (Nöbetçi Eczane & Durum) -->
  <div class="bg-sky-50 border-b border-sky-100 px-4 py-2">
    <div class="max-w-md mx-auto flex items-center justify-between text-xs text-sky-900">
      <div class="flex items-center gap-1.5 font-medium">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <i class="fa-solid fa-kit-medical text-red-500"></i> Nöbetçi: Merkez Eczanesi (Sahil)
      </div>
      <span class="text-[11px] text-sky-700 bg-sky-200/60 px-2 py-0.5 rounded-full font-semibold">Silivri 22°C</span>
    </div>
  </div>

  <!-- Ana İçerik Konteyneri -->
  <main class="max-w-md mx-auto px-4 pt-3">
    
    <!-- Mahalle Filtreleri -->
    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none text-xs font-medium">
      <button onclick="filterPosts('Tümü')" class="filter-btn active bg-slate-900 text-white px-3 py-1.5 rounded-full whitespace-nowrap">Tüm Silivri</button>
      <button onclick="filterPosts('Selimpaşa')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Selimpaşa</button>
      <button onclick="filterPosts('Merkez')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Sahil / Merkez</button>
      <button onclick="filterPosts('Değirmenköy')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Değirmenköy</button>
      <button onclick="filterPosts('Gümüşyaka')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Gümüşyaka</button>
      <button onclick="filterPosts('Çanta')" class="filter-btn bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full whitespace-nowrap">Çanta</button>
    </div>

    <!-- Gönderi Akışı -->
    <div id="posts-container" class="mt-3 space-y-3">
      <div class="p-8 text-center text-slate-400 text-sm">
        <i class="fa-solid fa-spinner fa-spin text-xl mb-2 text-sky-600"></i>
        <p>Gönderiler yükleniyor...</p>
      </div>
    </div>
  </main>

  <!-- Gönderi Paylaşma Modalı -->
  <div id="postModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl animate-fade-in">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-slate-900 text-base">Mahallene Not Bırak</h3>
        <button onclick="closePostModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>
      
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Adınız / Rumuz</label>
          <input id="authorName" type="text" placeholder="Örn: Mehmet Usta, Ayşe Hanım" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Mahalle</label>
          <select id="postNeighborhood" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-sky-500 bg-white">
            <option value="Merkez">Silivri Merkez</option>
            <option value="Selimpaşa">Selimpaşa</option>
            <option value="Gümüşyaka">Gümüşyaka</option>
            <option value="Değirmenköy">Değirmenköy</option>
            <option value="Çanta">Çanta</option>
            <option value="Danamandıra">Danamandıra</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Ne paylaşmak istiyorsun?</label>
          <textarea id="postContent" rows="3" placeholder="Sohbet, duyuru, kayıp eşya/hayvan veya yerel tavsiye..." class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-sky-500"></textarea>
        </div>
        <button onclick="submitPost()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-lg shadow-sm transition">
          Yayınla
        </button>
      </div>
    </div>
  </div>

  <!-- Alt Menü (Bottom Navigation) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40 py-2">
    <div class="max-w-md mx-auto flex justify-around text-center">
      <a href="#" class="text-sky-600 flex flex-col items-center">
        <i class="fa-solid fa-compass text-base"></i>
        <span class="text-[10px] font-semibold mt-0.5">Meydan</span>
      </a>
      <a href="#" onclick="alert('KıyıKöşe Pazar yakında açılıyor!')" class="text-slate-400 hover:text-slate-600 flex flex-col items-center">
        <i class="fa-solid fa-store text-base"></i>
        <span class="text-[10px] font-medium mt-0.5">Pazar</span>
      </a>
      <a href="#" onclick="alert('Silivri Onaylı Esnaf Rehberi yakında açılıyor!')" class="text-slate-400 hover:text-slate-600 flex flex-col items-center">
        <i class="fa-solid fa-wrench text-base"></i>
        <span class="text-[10px] font-medium mt-0.5">Esnaf</span>
      </a>
    </div>
  </nav>

  <script>
    // SUPABASE BAĞLANTISI (Sizin bilgilerinizi buraya tanımladık)
    const SUPABASE_URL = 'https://vsdrfmdpripcshcgqvxm.supabase.co';
    // Kopyaladığınız publishable key'i buraya yapıştıracaksınız:
    const SUPABASE_KEY = 'sb_publishable_AqSPfSbaoFRQnCNiQGr3Dg_Lf5ztqvk';
    
    const db = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let allPosts = [];

    async function fetchPosts() {
      const container = document.getElementById('posts-container');
      try {
        const { data, error } = await db.from('posts').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        allPosts = data || [];
        renderPosts(allPosts);
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="bg-white rounded-xl p-5 border border-slate-200 text-center text-slate-500 text-xs">
            <p class="font-medium text-slate-700 mb-1">Henüz hiç gönderi yok veya ilk gönderiyi siz ekleyin!</p>
            <p>Yukarıdaki "+ Paylaş" butonuna tıklayarak ilk notu bırakabilirsiniz.</p>
          </div>
        `;
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById('posts-container');
      if (!posts || posts.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl p-5 border border-slate-200 text-center text-slate-500 text-xs">
            <p class="font-medium text-slate-700">Bu mahallede henüz paylaşım yok.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = posts.map(p => `
        <div class="bg-white rounded-xl p-4 border border-slate-200/80 shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-slate-600 text-xs">
                ${(p.category || 'S')[0].toUpperCase()}
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-800 leading-tight">${p.category || 'Silivri Sakini'}</h4>
                <span class="text-[10px] text-slate-400 font-medium">${p.neighborhood}</span>
              </div>
            </div>
            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">${p.neighborhood}</span>
          </div>
          <p class="text-xs text-slate-700 leading-relaxed">${p.content}</p>
        </div>
      `).join('');
    }

    function filterPosts(nh) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-slate-900', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700');
        if (btn.innerText.includes(nh)) {
          btn.classList.add('bg-slate-900', 'text-white');
          btn.classList.remove('bg-white', 'text-slate-700');
        }
      });

      if (nh === 'Tümü') {
        renderPosts(allPosts);
      } else {
        const filtered = allPosts.filter(p => p.neighborhood.toLowerCase().includes(nh.toLowerCase()));
        renderPosts(filtered);
      }
    }

    function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
    function closePostModal() { document.getElementById('postModal').classList.add('hidden'); }

    async function submitPost() {
      const name = document.getElementById('authorName').value || 'Silivri Sakini';
      const neighborhood = document.getElementById('postNeighborhood').value;
      const content = document.getElementById('postContent').value;

      if (!content.trim()) {
        alert('Lütfen bir şeyler yazın.');
        return;
      }

      try {
        const { error } = await db.from('posts').insert([{
          category: name,
          neighborhood: neighborhood,
          content: content
        }]);

        if (error) throw error;
        closePostModal();
        document.getElementById('postContent').value = '';
        fetchPosts();
      } catch (err) {
        alert('Hata oluştu: ' + err.message);
      }
    }

    window.onload = fetchPosts;
  </script>
</body>
</html>
